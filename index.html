<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASCII cam</title>
<style>
:root{--bg:#000;--fg:#e6ffe9;--panel:#121212;--btn:#1f1f1f;--line:#333;--accent:#35e06b;color-scheme:dark;box-sizing:border-box;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column}
#stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
canvas{max-width:100%;max-height:100%}
#start{position:absolute;padding:14px 26px;font-size:18px;border:0;border-radius:12px;background:var(--accent);color:#012;font-weight:600}
#msg{position:absolute;bottom:8px;left:12px;right:12px;text-align:center;font-size:13px;opacity:.85}
#bar{display:flex;gap:8px;padding:10px 12px;background:var(--panel);justify-content:center}
button{background:var(--btn);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:15px}
button.on{border-color:var(--accent);color:var(--accent)}
#panel{display:none;max-height:48vh;overflow-y:auto;background:var(--panel);border-top:1px solid var(--line);padding:10px 14px}
#panel.open{display:block}
.row{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px}
.row>span:first-child{width:112px;flex:none}
.row input[type=range]{flex:1;min-width:0}
.row .val{width:38px;text-align:right;opacity:.7;font-variant-numeric:tabular-nums}
select,input[type=text]{flex:1;min-width:0;background:var(--btn);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:14px}
input[type=color]{width:44px;height:32px;border:0;background:none;padding:0}
#shot{position:fixed;inset:0;background:#000e;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;box-sizing:border-box}
#shot img{max-width:100%;max-height:75%;border:1px solid var(--line)}
</style>
</head>
<body>
<div id="stage">
  <canvas id="out" width="640" height="480"></canvas>
  <button id="start">Включить камеру</button>
  <div id="msg"></div>
</div>
<div id="panel"></div>
<div id="bar">
  <button id="flip">Камера</button>
  <button id="cfg">Настройки</button>
  <button id="snap">Снимок</button>
</div>
<div id="shot"><img id="shotimg" alt="Снимок"><div style="display:flex;gap:8px"><button id="shotsave" class="on">Сохранить</button><button id="shotclose">Закрыть</button></div><span style="font-size:13px;opacity:.7">Если не сохранилось, зажми картинку</span></div>
<video id="vid" playsinline muted style="display:none"></video>

<script>
(function(){
  var SETS={
    "Классика":" .:-=+*#%@",
    "Подробный":" .'`^\",:;Il!i><~+_-?][}{1)(|/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$",
    "Блоки":" ░▒▓█",
    "Точки":" ·•●",
    "Бинарный":" 01",
    "Свой":" .oO@"
  };
  var PAL={"Цвет":null,"Зелёный":[53,224,107],"Янтарь":[255,176,0],"Белый":[255,255,255],"Голубой":[0,229,255]};
  var D={set:"Классика",custom:" .oO@",pal:"Цвет",cols:90,quality:2,contrast:1.3,bright:0,gamma:0.8,sat:1.2,floor:70,sharp:0.5,auto:1,invert:0,mirror:1,bg:"#000000"};
  var S=Object.assign({},D);
  try{var sv=JSON.parse(localStorage.getItem("asciicam2")||"null");if(sv)Object.assign(S,sv);}catch(e){}
  function save(){try{localStorage.setItem("asciicam2",JSON.stringify(S));}catch(e){}}

  var out=document.getElementById("out"), ctx=out.getContext("2d");
  var vid=document.getElementById("vid"), msg=document.getElementById("msg");
  var tmp=document.createElement("canvas"), tctx=tmp.getContext("2d",{willReadFrequently:true});
  var facing="user", stream=null, running=false, chars=[];

  function say(t){msg.textContent=t||"";}
  function rebuildChars(){chars=Array.from(S.set==="Свой"?(S.custom||" ."):SETS[S.set]);}

  /* ---------- панель настроек ---------- */
  var panel=document.getElementById("panel");
  function row(label,el,val){
    var r=document.createElement("div");r.className="row";
    var s=document.createElement("span");s.textContent=label;r.appendChild(s);r.appendChild(el);
    if(val){r.appendChild(val);}panel.appendChild(r);
  }
  function slider(key,label,min,max,step){
    var i=document.createElement("input");i.type="range";i.min=min;i.max=max;i.step=step;i.value=S[key];
    var v=document.createElement("span");v.className="val";v.textContent=S[key];
    i.oninput=function(){S[key]=+i.value;v.textContent=i.value;save();};
    row(label,i,v);
  }
  function select(key,label,opts,after){
    var s=document.createElement("select");
    opts.forEach(function(o){var op=document.createElement("option");op.value=o[0];op.textContent=o[1];if(String(S[key])===String(o[0]))op.selected=true;s.appendChild(op);});
    s.onchange=function(){S[key]=isNaN(+s.value)||s.value===""?s.value:+s.value;save();if(after)after();};
    row(label,s);
  }
  function check(key,label){
    var i=document.createElement("input");i.type="checkbox";i.checked=!!S[key];
    i.onchange=function(){S[key]=i.checked?1:0;save();};
    row(label,i);
  }
  select("pal","Цвет символов",Object.keys(PAL).map(function(k){return [k,k];}));
  select("set","Набор символов",Object.keys(SETS).map(function(k){return [k,k];}),rebuildChars);
  var ci=document.createElement("input");ci.type="text";ci.value=S.custom;
  ci.oninput=function(){S.custom=ci.value;save();rebuildChars();};
  row("Свой набор",ci);
  slider("cols","Символов в ряду",40,220,1);
  select("quality","Чёткость",[[1,"Обычная"],[2,"Высокая"],[3,"Максимум"]]);
  slider("contrast","Контраст",0.5,3,0.05);
  slider("bright","Яркость",-100,100,1);
  slider("gamma","Гамма (тени)",0.4,2.2,0.05);
  slider("floor","Мин. яркость",0,200,1);
  slider("sat","Насыщенность",0,3,0.05);
  slider("sharp","Резкость",0,3,0.05);
  check("auto","Авто-уровни");
  check("invert","Инверсия");
  check("mirror","Зеркало (фронталка)");
  var bg=document.createElement("input");bg.type="color";bg.value=S.bg;
  bg.oninput=function(){S.bg=bg.value;save();};
  row("Фон",bg);
  var rs=document.createElement("button");rs.textContent="Сбросить настройки";
  rs.onclick=function(){S=Object.assign({},D);save();location.reload();};
  panel.appendChild(rs);

  /* ---------- камера ---------- */
  async function openCam(){
    if(stream)stream.getTracks().forEach(function(t){t.stop();});
    try{
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1280}},audio:false});
      vid.srcObject=stream;await vid.play();
      document.getElementById("start").style.display="none";say("");
      if(!running){running=true;requestAnimationFrame(loop);}
    }catch(e){say("Нет доступа к камере ("+(e&&e.name||"ошибка")+"). Нужен HTTPS и разрешение в браузере.");}
  }

  /* ---------- рендер ---------- */
  var last=0, hist=new Uint32Array(256);
  function clamp(v){return v<0?0:v>255?255:v;}
  function loop(t){
    requestAnimationFrame(loop);
    if(t-last<33||vid.readyState<2||!vid.videoWidth)return;last=t;
    var cols=S.cols, CW=4*S.quality+2, CH=CW*2;
    var rows=Math.max(8,Math.round(cols*vid.videoHeight/vid.videoWidth*(CW/CH)));
    if(tmp.width!==cols||tmp.height!==rows){tmp.width=cols;tmp.height=rows;}
    if(out.width!==cols*CW||out.height!==rows*CH){out.width=cols*CW;out.height=rows*CH;}
    tctx.imageSmoothingQuality="high";
    tctx.save();
    if(facing==="user"&&S.mirror){tctx.translate(cols,0);tctx.scale(-1,1);}
    tctx.drawImage(vid,0,0,cols,rows);tctx.restore();
    var d=tctx.getImageData(0,0,cols,rows).data, n=cols*rows;
    var L=new Float32Array(n), i, c, r;
    hist.fill(0);
    for(i=0;i<n;i++){var y=(d[i*4]*299+d[i*4+1]*587+d[i*4+2]*114)/1000;L[i]=y;hist[y|0]++;}
    var lo=0, hi=255;
    if(S.auto){
      var a=0,cut=n*0.02;
      for(lo=0;lo<255;lo++){a+=hist[lo];if(a>cut)break;}
      a=0;for(hi=255;hi>0;hi--){a+=hist[hi];if(a>cut)break;}
      if(hi-lo<30){lo=0;hi=255;}
    }
    var span=hi-lo, g=S.gamma, ct=S.contrast, br=S.bright, sh=S.sharp, nch=chars.length-1;
    var Y=new Float32Array(n);
    for(i=0;i<n;i++){
      var v=clamp((L[i]-lo)/span*255);
      v=((v/255-0.5)*ct+0.5)*255+br;
      Y[i]=255*Math.pow(clamp(v)/255,g);
    }
    if(sh>0){
      var Z=new Float32Array(Y);
      for(r=1;r<rows-1;r++)for(c=1;c<cols-1;c++){
        i=r*cols+c;
        Z[i]=clamp(Y[i]+sh*(4*Y[i]-Y[i-1]-Y[i+1]-Y[i-cols]-Y[i+cols])*0.5);
      }
      Y=Z;
    }
    ctx.fillStyle=S.bg;ctx.fillRect(0,0,out.width,out.height);
    ctx.font="bold "+Math.round(CH*0.92)+"px ui-monospace,Menlo,Consolas,monospace";
    ctx.textAlign="center";ctx.textBaseline="middle";
    var pal=PAL[S.pal], fl=S.floor, sat=S.sat, inv=S.invert;
    for(r=0;r<rows;r++){
      for(c=0;c<cols;c++){
        i=r*cols+c;
        var yy=inv?255-Y[i]:Y[i];
        var k=Math.round(yy/255*nch);
        if(k===0&&chars[0]===" ")continue;
        var tb=fl+(255-fl)*yy/255, R,G,B;
        if(pal){R=pal[0]*tb/255;G=pal[1]*tb/255;B=pal[2]*tb/255;}
        else{
          var j=i*4, gr=L[i];
          var rr=gr+(d[j]-gr)*sat, gg=gr+(d[j+1]-gr)*sat, bb=gr+(d[j+2]-gr)*sat;
          var m=Math.max(rr,gg,bb,1), s=tb/m;
          R=clamp(rr*s);G=clamp(gg*s);B=clamp(bb*s);
        }
        ctx.fillStyle="rgb("+(R|0)+","+(G|0)+","+(B|0)+")";
        ctx.fillText(chars[k],c*CW+CW/2,r*CH+CH/2);
      }
    }
  }

  /* ---------- кнопки ---------- */
  document.getElementById("start").onclick=openCam;
  document.getElementById("flip").onclick=function(){facing=facing==="user"?"environment":"user";if(stream)openCam();};
  var cfg=document.getElementById("cfg");
  cfg.onclick=function(){panel.classList.toggle("open");cfg.classList.toggle("on");};
  var shotBlob=null;
  document.getElementById("snap").onclick=function(){
    out.toBlob(function(b){
      shotBlob=b;
      document.getElementById("shotimg").src=URL.createObjectURL(b);
      document.getElementById("shot").style.display="flex";
    },"image/png");
  };
  document.getElementById("shotsave").onclick=async function(){
    if(!shotBlob)return;
    var p=function(n){return String(n).padStart(2,"0");}, dt=new Date();
    var name="ascii-"+dt.getFullYear()+p(dt.getMonth()+1)+p(dt.getDate())+"-"+p(dt.getHours())+p(dt.getMinutes())+p(dt.getSeconds())+".png";
    var file=new File([shotBlob],name,{type:"image/png"});
    try{
      if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return;}
    }catch(e){if(e&&e.name==="AbortError")return;}
    var a=document.createElement("a");
    a.href=URL.createObjectURL(shotBlob);a.download=name;
    document.body.appendChild(a);a.click();a.remove();
  };
  document.getElementById("shotclose").onclick=function(){document.getElementById("shot").style.display="none";};
  rebuildChars();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)say("Браузер не поддерживает доступ к камере.");
})();
</script>
</body>
</html>
